# Stages a version on npm when a tag vX.Y.Z is pushed: tested and built here, then `npm stage
# publish` with npm's trusted publishing (no npm token anywhere; npm trusts this workflow in this
# repository). Nothing is public until the owner approves the staged version on npmjs.com: the
# trusted publisher may only stage, not publish. A prerelease (1.0.0-rc.13) goes to `next`, a
# release to `latest`.
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: yarn install --frozen-lockfile
      - name: The tag is the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match package.json ($version)"; exit 1
          fi
          case "$version" in *-*) echo "NPM_TAG=next" >> "$GITHUB_ENV" ;; *) echo "NPM_TAG=latest" >> "$GITHUB_ENV" ;; esac
      - run: node scripts/check-tag.js && npm test && npm run build
        env:
          npm_config_tag: ${{ env.NPM_TAG }}
      # `npm stage` came with npm 12.
      - run: npm install -g npm@12
      - run: npm stage publish . --tag "$NPM_TAG" --ignore-scripts
